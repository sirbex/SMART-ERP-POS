name: Henber AP Fix Orphan Payments

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only (1) or apply (0)'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '0'

jobs:
  fix:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          ssh-keyscan -H 209.38.203.138 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Fix orphan payment headers and allocate
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ssh -i ~/.ssh/prod_key -o ConnectTimeout=30 root@209.38.203.138 bash -s <<REMOTE
          set -euo pipefail
          cd /opt/smarterp
          git fetch origin main
          git checkout origin/main -- scripts/henber-ap-fix-orphan-payments.mjs
          docker cp scripts/henber-ap-fix-orphan-payments.mjs smarterp-backend:/tmp/henber-ap-fix-orphan-payments.mjs
          docker exec -u root smarterp-backend cp /tmp/henber-ap-fix-orphan-payments.mjs /app/henber-ap-fix-orphan-payments.mjs
          docker exec -u root smarterp-backend chown nodejs:nodejs /app/henber-ap-fix-orphan-payments.mjs
          docker exec -w /app -e DRY_RUN=${DRY_RUN} smarterp-backend node henber-ap-fix-orphan-payments.mjs
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/prod_key
