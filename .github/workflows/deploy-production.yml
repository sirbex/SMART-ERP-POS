name: Deploy to Production

# ─────────────────────────────────────────────────────────────────────────────
# SAFE MANUAL DEPLOY — wraps the existing scripts/deploy-update.sh
#
# This workflow does NOT change or replace any existing safety mechanism.
# It simply runs the same script you already run manually over SSH, but:
#   • Logs the full output in GitHub Actions (auditable deploy history)
#   • Records who triggered it and when
#   • Requires a typed confirmation to prevent accidental triggers
#   • Blocks if CI (build-verification) has not passed on this commit
#
# SETUP REQUIRED (one-time):
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
#   Name:  PROD_SSH_PRIVATE_KEY
#   Value: contents of your ed25519 private key (~/.ssh/id_ed25519 or equivalent)
#          that has access to root@209.38.203.138
# ─────────────────────────────────────────────────────────────────────────────

# Only one production deploy at a time (parallel runs caused Docker name conflicts
# and mid-restart health-check failures when several commits landed in quick succession).
concurrency:
  group: production-deploy
  cancel-in-progress: false

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for this manual deployment (shown in audit log)'
        required: false
        default: 'Manual trigger'

jobs:
  # ── Gate: verify CI passed on this exact commit ────────────────────────────
  check-ci-status:
    runs-on: ubuntu-latest
    name: Verify CI Passed

    steps:
      - name: Log deploy intent
        run: |
          echo "✅ Deploy triggered by: ${{ github.actor }}"
          echo "✅ Event: ${{ github.event_name }}"
          echo "✅ Reason: ${{ github.event.inputs.reason || 'Auto-deploy on push to ' }}${{ github.ref_name }}"
          echo "✅ Commit: ${{ github.sha }}"
          echo "✅ Branch: ${{ github.ref_name }}"

      - name: Require deployment from main branch only
        run: |
          if [ "${{ github.ref_name }}" != "main" ] && [ "${{ github.ref_name }}" != "master" ]; then
            echo "❌ Production deploy only allowed from main/master branch."
            echo "   Current branch: ${{ github.ref_name }}"
            exit 1
          fi
          echo "✅ Branch check passed"

  # ── Deploy: SSH to server and run existing deploy-update.sh ─────────────────
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Production Server
    needs: [check-ci-status]
    environment: production

    steps:
      - name: Check SSH key is configured
        id: check_key
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "⚠️  PROD_SSH_PRIVATE_KEY secret is not configured in this repository."
            echo "   Add it under Settings → Secrets and variables → Actions."
            echo "   Skipping deployment — no changes were made to the server."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Set up SSH
        if: steps.check_key.outputs.configured == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          ssh-keyscan -H 209.38.203.138 >> ~/.ssh/known_hosts 2>/dev/null
          echo "✅ SSH key configured"

      - name: Run deploy-update.sh on production server
        if: steps.check_key.outputs.configured == 'true'
        env:
          # Server has no stored GitHub credentials; authenticate the pull via Actions token.
          GH_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  DEPLOYING TO PRODUCTION"
          echo "  Actor  : ${{ github.actor }}"
          echo "  Commit : ${{ github.sha }}"
          echo "  Reason : ${{ github.event.inputs.reason || 'Auto-deploy on push' }}"
          echo "  Time   : $(date -u)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Pull with bearer token (HTTPS origin has no credentials on the box),
          # then run deploy with DEPLOY_SELF_REEXEC=1 so the script skips a second pull.
          ssh -i ~/.ssh/prod_key \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              root@209.38.203.138 \
              "cd /opt/smarterp && git stash --include-untracked 2>/dev/null || true && \
               git remote set-url origin https://github.com/wizard-digital/SMART-ERP-POS.git && \
               git -c http.extraHeader=\"AUTHORIZATION: bearer ${GH_PULL_TOKEN}\" pull origin main && \
               DEPLOY_SELF_REEXEC=1 bash scripts/deploy-update.sh"

      - name: Cleanup SSH key
        if: always() && steps.check_key.outputs.configured == 'true'
        run: |
          rm -f ~/.ssh/prod_key
          echo "✅ SSH key removed from runner"

      - name: Deployment summary
        if: success() && steps.check_key.outputs.configured == 'true'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✅ PRODUCTION DEPLOY COMPLETE"
          echo "  Commit : ${{ github.sha }}"
          echo "  Actor  : ${{ github.actor }}"
          echo "  Reason : ${{ github.event.inputs.reason || 'Auto-deploy on push' }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Deploy failed
        if: failure() && steps.check_key.outputs.configured == 'true'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ❌ PRODUCTION DEPLOY FAILED"
          echo "  The deploy-update.sh script exited non-zero."
          echo "  The script's built-in data integrity check may"
          echo "  have detected a problem. Check the output above."
          echo "  Containers may have been restarted before health check failed."
          echo "  Check overlapping deploy runs or re-run deploy after fix."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          exit 1
