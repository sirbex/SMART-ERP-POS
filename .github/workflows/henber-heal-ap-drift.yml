name: Henber Heal AP Drift

on:
  workflow_dispatch:

jobs:
  heal:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          ssh-keyscan -H 209.38.203.138 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Recalc suppliers, heal AP drift, rebuild GPB
        run: |
          scp -i ~/.ssh/prod_key -o ConnectTimeout=30 \
            scripts/henber-heal-ap-drift-force.mjs \
            root@209.38.203.138:/tmp/henber-heal-ap-drift-force.mjs
          ssh -i ~/.ssh/prod_key -o ConnectTimeout=30 root@209.38.203.138 bash -s <<'REMOTE'
          set -euo pipefail
          docker cp /tmp/henber-heal-ap-drift-force.mjs smarterp-backend:/tmp/henber-heal-ap-drift-force.mjs
          docker exec -u root smarterp-backend cp /tmp/henber-heal-ap-drift-force.mjs /app/henber-heal-ap-drift-force.mjs
          docker exec -u root smarterp-backend chown nodejs:nodejs /app/henber-heal-ap-drift-force.mjs
          docker exec -w /app smarterp-backend node henber-heal-ap-drift-force.mjs
          REMOTE

      - name: Verify AP reconciliation
        run: |
          scp -i ~/.ssh/prod_key -o ConnectTimeout=30 \
            scripts/ap-drift-investigation.mjs \
            root@209.38.203.138:/tmp/ap-drift-investigation.mjs
          ssh -i ~/.ssh/prod_key -o ConnectTimeout=30 root@209.38.203.138 bash -s <<'REMOTE'
          set -euo pipefail
          docker cp /tmp/ap-drift-investigation.mjs smarterp-backend:/tmp/ap-drift-investigation.mjs
          docker exec -u root smarterp-backend cp /tmp/ap-drift-investigation.mjs /app/ap-drift-investigation.mjs
          docker exec -u root smarterp-backend chown nodejs:nodejs /app/ap-drift-investigation.mjs
          docker exec -w /app smarterp-backend node ap-drift-investigation.mjs
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/prod_key
