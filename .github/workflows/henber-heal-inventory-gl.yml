name: Henber Heal Inventory GL

on:
  workflow_dispatch:

jobs:
  heal:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          ssh-keyscan -H 209.38.203.138 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Heal inventory GL drift on Henber
        run: |
          ssh -i ~/.ssh/prod_key -o ConnectTimeout=30 root@209.38.203.138 bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/smarterp
          git fetch origin main
          git checkout origin/main -- scripts/henber-heal-inventory-gl.mjs
          docker cp scripts/henber-heal-inventory-gl.mjs smarterp-backend:/tmp/henber-heal-inventory-gl.mjs
          docker exec smarterp-backend node /tmp/henber-heal-inventory-gl.mjs
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/prod_key
